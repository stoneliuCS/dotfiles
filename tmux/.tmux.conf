# Tmux plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'
# Binds C-h/j/k/l to move between panes, but first checks whether the
# focused pane is running vim/nvim -- if so it forwards the key instead, so
# the same four keys walk nvim splits and tmux panes as one grid.
set -g @plugin 'christoomey/vim-tmux-navigator'

# Allow Kitty graphics protocol passthrough (jupynvim image cells)
set -g allow-passthrough on

# Report focus events to programs inside panes (needed for Neovim to
# re-render images on refocus, and for the hook below to fire)
set -g focus-events on

# Kitty-protocol images are drawn directly on the real terminal, not in
# tmux's own screen buffer, so switching windows/panes doesn't erase them
# on its own and they can "ghost" into whatever you switch to next. Wipe
# on-screen images right before a pane loses focus; Neovim re-renders them
# on FocusGained (see nvim autocmds.lua). `--clear` doesn't work through
# tmux passthrough (per `kitten icat --help`), `--clear-all` does.
set-hook -g pane-focus-out 'run-shell -b "kitten icat --clear-all --silent >#{pane_tty} 2>/dev/null"'

# Remap key binds

unbind C-b
set-option -g prefix C-a 
bind-key C-a send-prefix
bind c new-window -c "#{pane_current_path}"
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
set -s copy-command 'pbcopy'
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
# Prefix v to enter copy mode
bind-key -T prefix v copy-mode

# Pane navigation is handled by vim-tmux-navigator (C-h/j/k/l, no prefix),
# registered as a plugin above. Resizing stays on the prefix: -r makes the
# key repeatable within repeat-time (500ms), so prefix H H H widens by 15.
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Split in the vim spirit: | is a vertical bar (side-by-side), - is a
# horizontal bar (stacked). Both inherit the current pane's directory.
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

set -g @dracula-plugins " "
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g @dracula-show-powerline true
set -g @dracula-plugins "git"

run '~/.tmux/plugins/tpm/tpm'
